name: CI/CD

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: racha_manager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PORT: 5432
      DB_NAME: racha_manager
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout de código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Garantir permissão de execução do mvnw
        run: chmod +x mvnw

      - name: Rodar testes
        run: ./mvnw test

      - name: Gerar relatório de cobertura (JaCoCo)
        run: ./mvnw jacoco:report

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  build-and-push:
    name: Build e Push da imagem Docker
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: 'true'
          tags: |
            ghcr.io/fcolucasvieira/racha-manager:latest
            ghcr.io/fcolucasvieira/racha-manager:${{github.sha}}
            
  deploy:
    name: Deploy na EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Conectar via SSH e atualizar containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            cd ~/racha-manager
            git pull origin main
            docker compose pull
            docker compose --profile app up -d
            docker image prune -f