services:
  postgres:
    image: postgres:17
    container_name: racha-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    volumes:
      - racha_manager_postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: racha-app

    profiles:
      - app

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    expose:
      - "8080"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: racha-nginx

    profiles:
      - app

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

    depends_on:
      - app

    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: racha-certbot

    profiles:
      - app

    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  prometheus:
    image: prom/prometheus
    container_name: racha-prometheus

    profiles:
      - observability

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    container_name: racha-grafana

    profiles:
      - observability

    ports:
    - "3000:3000"

    depends_on:
      - prometheus

    volumes:
      - racha_manager_grafana_data:/var/lib/grafana

volumes:
  racha_manager_postgres_data:
  racha_manager_grafana_data: