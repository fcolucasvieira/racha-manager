services:
  postgres:
    image: postgres:17
    container_name: racha-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - racha_manager_data:/var/lib/postgresql/data

volumes:
  racha_manager_data: